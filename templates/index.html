<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Emotion Detection Application</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <script src="./static/mywebscript.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
        }
        .center-heading {
            text-align: center;
            margin-bottom: 25px;
            font-weight: 700;
            color: #1a202c;
        }
        .main-card {
            max-width: 800px;
            margin: 50px auto;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border: none;
        }
        .card-body {
            padding: 40px;
        }
        #system_response {
            margin-top: 25px;
            padding: 15px 20px;
            font-size: 1.05rem;
            line-height: 1.6;
            color: #2d3748;
            background-color: #edf2f7;
            border-radius: 8px;
            border-left: 4px solid #3182ce;
            display: none;
        }
        .btn-primary {
            background-color: #3182ce;
            border-color: #3182ce;
            padding: 10px 24px;
            font-weight: 600;
            font-size: 1rem;
            border-radius: 6px;
        }
        .btn-primary:hover {
            background-color: #2b6cb0;
            border-color: #2b6cb0;
        }
        .form-control {
            border-radius: 6px;
            padding: 12px 16px;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card main-card">
            <div class="card-body">
                <h1 class="center-heading">NLP - Emotion Detection</h1>
                <div class="form-group">
                    <label for="textToAnalyze" class="font-weight-bold">Enter text for emotion analysis:</label>
                    <input type="text" id="textToAnalyze" class="form-control" placeholder="e.g. I am so happy and excited about this project!">
                </div>
                <button type="button" class="btn btn-primary" onclick="RunSentimentAnalysis()">Run Emotion Detection</button>
                <div id="system_response"></div>
            </div>
        </div>
    </div>
</body>
</html>
